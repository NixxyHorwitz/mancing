<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blueprint Sistem Upgrade, Model Profit & Strategi Deposit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      padding: 30px 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #334155;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
    }
    .mermaid {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      margin: 20px 0;
      display: flex;
      justify-content: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fef3c7;
      border: 1.5px solid #f59e0b;
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
    }
    .btn-print {
      background: #f59e0b;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <span>💡 Mode Visual Interaktif: Semua Diagram & Workflow Otomatis Dirender Menjadi Gambar Grafis</span>
    <button class="btn-print" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
  </div>
  <div id="content" class="markdown-body">Memuat dokumen...</div>
</div>

<script>
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

  fetch('PANDUAN_UPGRADE_DAN_PROFIT.md')
    .then(res => res.text())
    .then(async md => {
      const renderer = new marked.Renderer();
      const origCode = renderer.code.bind(renderer);
      
      renderer.code = function(code, lang) {
        if (lang === 'mermaid') {
          return '<pre class="mermaid">' + code + '</pre>';
        }
        return origCode(code, lang);
      };

      document.getElementById('content').innerHTML = marked.parse(md, { renderer });
      await mermaid.run({
        querySelector: '.mermaid'
      });
    })
    .catch(err => {
      document.getElementById('content').innerHTML = '<p style="color:red;">Gagal memuat file markdown. Pastikan file dibuka melalui web server lokal (contoh: http://mancing.test/PANDUAN_UPGRADE_DAN_PROFIT.html)</p>';
    });
</script>

</body>
</html>
