plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mancingcuan.forwarder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mancingcuan.forwarder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
