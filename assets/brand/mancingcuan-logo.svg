<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MancingCuan — ikan koral menyambar koin emas di kail (tema Living Coral Reef claymorphism) -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#22c3d8"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="fish" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fecdd3"/>
      <stop offset="0.35" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </radialGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="0.4" stop-color="#facc15"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </radialGradient>
    <clipPath id="badge"><rect x="22" y="22" width="468" height="468" rx="124"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#083344" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Lencana laut -->
  <rect x="22" y="22" width="468" height="468" rx="124" fill="url(#sea)"/>
  <g clip-path="url(#badge)">
    <circle cx="390" cy="118" r="62" fill="#fff7ed" opacity="0.55"/>
    <path d="M0 372 C70 342 120 392 190 366 S320 334 380 362 S470 376 512 352 V512 H0Z" fill="url(#wave)"/>
    <path d="M0 410 C80 388 140 428 220 404 S360 384 430 404 S490 410 512 398 V512 H0Z" fill="#0d5f73" opacity="0.55"/>
    <path d="M60 388 C90 378 112 384 132 380" stroke="#ccfbf1" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M300 372 C330 362 352 368 372 364" stroke="#ccfbf1" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Senar & kail -->
  <path d="M352 22 C352 70 348 104 346 140" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M346 140 C346 176 382 182 388 152" stroke="#e2e8f0" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Koin emas di kail -->
  <g filter="url(#soft)">
    <circle cx="346" cy="196" r="64" fill="url(#coin)" stroke="#fff" stroke-width="10"/>
    <circle cx="346" cy="196" r="42" fill="none" stroke="#a16207" stroke-width="7" opacity="0.55"/>
    <path d="M346 168 L354 187 L375 188 L359 201 L364 222 L346 210 L328 222 L333 201 L317 188 L338 187Z" fill="#fffbeb"/>
    <ellipse cx="322" cy="166" rx="16" ry="9" fill="#fff" opacity="0.7" transform="rotate(-35 322 166)"/>
  </g>

  <!-- Ikan koral melompat -->
  <g filter="url(#soft)" transform="rotate(-24 220 300)">
    <!-- ekor -->
    <path d="M92 300 C60 252 54 232 66 220 C88 232 112 262 128 290 C112 318 88 348 66 360 C54 348 60 328 92 300Z" fill="url(#fin)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <!-- sirip punggung -->
    <path d="M168 228 C188 180 236 168 262 186 C246 198 232 214 226 232Z" fill="url(#fin)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <!-- badan -->
    <path d="M118 300 C118 236 186 212 248 214 C316 216 352 262 352 300 C352 338 316 384 248 386 C186 388 118 364 118 300Z" fill="url(#fish)" stroke="#fff" stroke-width="12"/>
    <!-- sisik / garis perut -->
    <path d="M170 312 C200 340 260 348 318 326" stroke="#fff1f2" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M196 262 C206 252 218 252 226 262" stroke="#fda4af" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M196 290 C206 280 218 280 226 290" stroke="#fda4af" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- sirip dada -->
    <path d="M236 318 C252 318 268 330 270 350 C250 350 236 338 236 318Z" fill="url(#fin)" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
    <!-- mulut terbuka -->
    <path d="M346 288 C334 296 334 308 346 314" stroke="#9f1239" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- mata -->
    <circle cx="296" cy="270" r="24" fill="#fff"/>
    <circle cx="302" cy="272" r="14" fill="#1e1b2e"/>
    <circle cx="307" cy="266" r="5" fill="#fff"/>
    <!-- pipi -->
    <ellipse cx="312" cy="312" rx="12" ry="7" fill="#fecdd3" opacity="0.9"/>
    <!-- kilau clay -->
    <ellipse cx="200" cy="244" rx="34" ry="12" fill="#fff" opacity="0.55" transform="rotate(-12 200 244)"/>
  </g>

  <!-- Gelembung -->
  <circle cx="108" cy="146" r="16" fill="#fff" opacity="0.75"/>
  <circle cx="140" cy="104" r="9" fill="#fff" opacity="0.6"/>
  <circle cx="436" cy="300" r="11" fill="#fff" opacity="0.6"/>

  <!-- Bingkai putih clay -->
  <rect x="22" y="22" width="468" height="468" rx="124" fill="none" stroke="#fff" stroke-width="14"/>
  <rect x="34" y="34" width="444" height="444" rx="114" fill="none" stroke="#0e7490" stroke-opacity="0.18" stroke-width="6"/>
</svg>
